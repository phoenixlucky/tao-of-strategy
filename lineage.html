<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人物谱系 · 韬略之道</title>
  <meta name="description" content="兵家、道家、跨界者 —— 三脉人物谱系全图">

</head>
<body>

  <header>
    <!-- 水墨山水背景图 -->

    <!-- 浮墨粒子 -->

  <hr class="jin-divider">

  <div class="container">

    <!-- Navigation -->
    <nav class="site-nav" aria-label="主导航">
      <a class="nav-item" href="/tao-of-strategy/"><span class="icon icon--home" aria-hidden="true"></span><span>首页</span></a>
      <a class="nav-item" href="/tao-of-strategy/people/bingjia/index.html"><span class="icon icon--strategist" aria-hidden="true"></span><span>兵家</span></a>
      <a class="nav-item" href="/tao-of-strategy/people/daojia/index.html"><span class="icon icon--dao" aria-hidden="true"></span><span>道家</span></a>

      <a class="nav-item" href="/tao-of-strategy/about.html"><span class="icon icon--about" aria-hidden="true"></span><span>关于</span></a>
    </nav>

    <!-- 简介 -->
    <div class="lineage-intro">
      <p>
        <strong>30 位人物</strong>，跨越三千年时空，分列三脉：
        <span style="color:var(--face-jin);font-weight:600;"><span class="icon icon--strategist" aria-hidden="true"></span> 兵家</span> ·
        <span style="color:var(--face-zhuan);font-weight:600;"><span class="icon icon--crossover" aria-hidden="true"></span> 跨界</span> ·
        <span style="color:var(--face-bi);font-weight:600;"><span class="icon icon--dao" aria-hidden="true"></span> 道家</span>
      </p>
    </div>

    <!-- 图例 -->
    <div class="lineage-legend">
      <span class="legend-item"><span class="legend-line solid"></span> 同脉传承</span>
      <span class="legend-item"><span class="legend-line dashed"></span> 跨脉影响</span>
      <span class="legend-item"><span class="legend-line dotted"></span> 思想呼应</span>
    </div>

    <!-- 时代筛选 -->
    <div class="lineage-controls" id="eraFilters">
      <button class="era-filter-btn active" data-era="all"><span class="icon icon--about" aria-hidden="true"></span> 全部</button>
    </div>

    <p class="interact-hint"><span class="icon icon--search" aria-hidden="true"></span> 悬停或点击人物节点查看关联</p>

    <!-- 谱系图 -->
    <div class="lineage-wrapper">
      <div class="lineage-chart" id="lineageChart">
        <svg class="lineage-svg" id="lineageSvg"></svg>
        <div class="lineage-lanes" id="lineageLanes">
          <div class="lane" data-lane="bingjia">
            <div class="lane-header bingjia"><span class="icon icon--strategist" aria-hidden="true"></span> 兵家 · 进取</div>
            <div class="lane-content" id="laneBingjia"></div>
          </div>
          <div class="lane" data-lane="crossover">
            <div class="lane-header crossover"><span class="icon icon--crossover" aria-hidden="true"></span> 跨界 · 融合</div>
            <div class="lane-content" id="laneCrossover"></div>
          </div>
          <div class="lane" data-lane="daoren">
            <div class="lane-header daoren"><span class="icon icon--dao" aria-hidden="true"></span> 道家 · 避世</div>
            <div class="lane-content" id="laneDaoren"></div>
          </div>
        </div>
      </div>
    </div>
